[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "commercial-analog-search"
version = "0.1.0"
description = "Search persistent molecular catalogues for commercially listed analogues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fpsim2>=0.7,<0.8", "openpyxl>=3.1,<4", "pandas>=2.2,<4", "pyyaml>=6,<7", "rdkit>=2025.3", "typer>=0.15,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
commercial-search = "commercial_analog_search.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/commercial_analog_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

